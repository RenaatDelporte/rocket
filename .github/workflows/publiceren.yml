name: Website publiceren

# Zet de site online bij elke wijziging op main.
# Handmatig starten kan ook: tabblad Actions → "Website publiceren" → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publiceren
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Schermafbeeldingen van websites nemen
        run: |
          if node scripts/schermafbeeldingen.mjs --nodig; then
            npm install --no-save --no-package-lock playwright@1.47.2
            npx playwright install --with-deps chromium
            node scripts/schermafbeeldingen.mjs
          else
            echo "Geen nieuwe schermafbeeldingen nodig."
          fi

      - name: Ontbrekende beelden ophalen
        run: |
          pip install --quiet pillow
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python scripts/beelden_ophalen.py

      - name: Nieuwe beelden bewaren in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/img scripts
          if git diff --cached --quiet; then
            echo "Geen nieuwe beelden."
          else
            git commit -m "Beelden opgehaald van de oude website"
            git push
          fi

      - name: Website bouwen (losse pagina's, sitemap, gegevens voor Google en AI)
        run: node scripts/bouw.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
